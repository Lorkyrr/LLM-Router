name: router-verify

# Por enquanto só dispara manualmente, com aprovação do usuário:
#   gh workflow run router-verify.yml -f ref=<branch> -f base=main
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch a testar
        required: true
      base:
        description: Branch base
        default: main

jobs:
  verify:
    # Runner no próprio PC (CPU), instalado por ci/runner-install.sh.
    runs-on: [self-hosted, router-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: CI
        env:
          BASE_REF: ${{ inputs.base }}
          CI_CLUSTER: ${{ vars.CI_CLUSTER }}
        run: ci/pr-ci.sh

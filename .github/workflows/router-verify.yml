name: router-verify

on: pull_request

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: ci/kind-up.sh
      - run: npm test
      - run: npm run typecheck
      - run: ci/kind-down.sh
        if: always()

name: router-verify

on: pull_request

jobs:
  verify:
    # PRs router/* esperam o sinal do usuário (router-release.yml); aqui só rodam os demais.
    if: ${{ !startsWith(github.head_ref, 'router/') }}
    # Runner no próprio PC (CPU), instalado por ci/runner-install.sh.
    runs-on: [self-hosted, router-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: CI
        env:
          BASE_REF: ${{ github.base_ref }}
          CI_CLUSTER: ${{ vars.CI_CLUSTER }}
        run: ci/pr-ci.sh

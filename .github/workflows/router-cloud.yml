# ATENÇÃO: este workflow AINDA NÃO funciona de ponta a ponta. Falta:
#  - o banco local (SQLite do router) não existe no runner hospedado;
#  - as CLIs claude/grok não estão instaladas no runner;
#  - PR criado com GITHUB_TOKEN não dispara o router-verify (eventos do GITHUB_TOKEN não acionam workflows).
# Mantido só como esqueleto; não confie nele.
name: router-cloud

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task id to run
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ROUTER_DB: ${{ runner.temp }}/router.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Só categorias barata/média por padrão (dispatch.cloud_tiers em config/router.yaml).
      # Chaves só via Secrets e só neste passo; input só via env (nunca interpolado no shell).
      - name: Run router
        env:
          TASK: ${{ inputs.task }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node --import tsx src/cli.ts run --task "$TASK"
